<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CS Refresh Trip 2026</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .container {
      background: #020617;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .trip-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #1e293b;
      color: #e5e7eb;
    }
    textarea { resize: vertical; }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-size: 16px;
      cursor: pointer;
    }

    .success {
      display: none;
      margin-top: 20px;
      color: #22c55e;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="container">

  <!-- IMAGE -->
  <img src="trip-photo.png" alt="CS Refresh Trip" class="trip-image">

  <h1>CS Refresh Trip 2026 after internship</h1>

  <form id="tripForm">

    <!-- NAME -->
    <label>Full Name</label>
    <input type="text" name="entry.1147428280" required>

    <!-- PHONE -->
    <label>Phone Number</label>
    <input type="tel" name="entry.1404403395" required>

    <!-- AGREE -->
    <label>Do you agree with the trip idea?</label>
    <div class="radio-group">
      <label>
        <input type="radio" name="entry.1964980061" value="Yes" required>
        <span>Yes</span>
      </label>
      <label>
        <input type="radio" name="entry.1964980061" value="No">
        <span>No</span>
      </label>
    </div>

    <!-- DESTINATION TYPE -->
    <label>Destination Type</label>
    <select name="entry.1116604285" required>
      <option value="">-- Select --</option>
      <option>Natural place</option>
      <option>Resort</option>
      <option>Historical</option>
      <option>Other</option>
    </select>

    <!-- DESTINATION NAME -->
    <label>Preferred Destination (exact place)</label>
    <input type="text"
           name="entry.768237246"
           placeholder="e.g. Langano, Bishoftu"
           required>

    <!-- ACTIVITIES -->
    <label>Preferred Activities</label>
    <textarea name="entry.513316649"
              placeholder="games, music, tennis, discussion..."></textarea>

    <!-- COST -->
    <label>Maximum Cost (ETB)</label>
    <input type="number" name="entry.1663040019">

    <!-- DAY -->
    <label>Preferred Day</label>
    <select name="entry.195751698" required>
      <option value="">-- Select day --</option>
      <option>Sunday</option>
      <option>Monday</option>
      <option>Tuesday</option>
      <option>Wednesday</option>
      <option>Thursday</option>
      <option>Friday</option>
      <option>Saturday</option>
      <option>Any day is acceptable</option>
    </select>

    <button type="submit">Submit Response</button>
  </form>

  <div class="success" id="successMsg">
    ✅ Your response has been submitted successfully. Thank you!
  </div>

</div>

<script>
  const form = document.getElementById("tripForm");
  const successMsg = document.getElementById("successMsg");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    fetch(
      "https://docs.google.com/forms/d/e/1FAIpQLSeQWykRbnDbfITjDQU3DZnPGTeGGHg_GGODThxM7e3V-fp8Ag/formResponse",
      {
        method: "POST",
        mode: "no-cors",
        body: new FormData(form)
      }
    );

    form.reset();
    form.style.display = "none";
    successMsg.style.display = "block";
  });
</script>

</body>
</html>
