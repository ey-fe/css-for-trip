<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CS Refresh Trip 2026</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .container {
      background: #020617;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #1e293b;
      color: #e5e7eb;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }
    textarea { resize: vertical; }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-size: 16px;
      cursor: pointer;
    }
    .success {
      display: none;
      margin-top: 20px;
      color: #22c55e;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>CS Refresh Trip 2026</h1>

  <form id="tripForm">

    <label>Full Name</label>
    <input type="text" name="entry.1147428280" required>

    <label>Phone Number</label>
    <input type="tel" name="entry.1404403395" required>

    <label>Do you agree with the trip idea?</label>
    <div class="radio-group">
      <label>
         <input type="radio" name="entry.1964980061" value="yes" required> 
        <span>Yes</span>
      </label>
      
      <label>
       <input type="radio" name="entry.1964980061" value="no">
        <span>No</span>
      </label>
    </div>
    <label>Destination type</label>
    <select name="entry.1116604285" required>
      <option value="">-- Select --</option>
      <option value="natural">Natural place</option>
      <option value="resort">Resort</option>
      <option value="historical">Historical</option>
      <option value="other">Other</option>
    </select>

    <label>Preferred Destination (write exact place)</label>
    <input type="text"
           name="entry.768237246"
           placeholder="e.g. Langano, Bishoftu"
           required>

    <label>Preferred Activities</label>
    <textarea name="entry.513316649"
              placeholder="games, music, tennis, discussion..."></textarea>

    <label>Maximum Cost (ETB)</label>
    <input type="number" name="entry.1663040019">
    
    <select name="entry.195751698" required>
      <option value="">-- Select day --</option>
      <option>Sunday</option>
      <option>Monday</option>
      <option>tuesday</option>
      <option>wendesday</option>
      <option>thursday</option>
      <option>any day is acceptable</option>
    </select>
    <button type="submit">Submit Response</button>
  </form>

  <div class="success" id="successMsg">
    ✅ Your response has been submitted successfully. Thank you!
  </div>
</div>

<script>
  const form = document.getElementById("tripForm");
  const successMsg = document.getElementById("successMsg");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    fetch(
      "https://docs.google.com/forms/d/e/1FAIpQLSeQWykRbnDbfITjDQU3DZnPGTeGGHg_GGODThxM7e3V-fp8Ag/formResponse",
      {
        method: "POST",
        mode: "no-cors",
        body: new FormData(form)
      }
    );

    form.reset();
    form.style.display = "none";
    successMsg.style.display = "block";
  });
</script>

</body>
</html>
