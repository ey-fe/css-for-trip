<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CS Refresh Trip 2026</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .container {
      background: #020617;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
    }10:30 AM 1/20/2026
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #1e293b;
      color: #e5e7eb;
    }
    textarea {
      resize: vertical;
    }
    .radio-group {
      margin-top: 5px;
    }
    .radio-group input {
      width: auto;
      margin-right: 5px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0ea5e9;
    }
    .note {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>CS Refresh Trip 2026</h1>

    <form
      action="https://docs.google.com/forms/d/e/1FAIpQLSeQWykRbnDbfITjDQU3DZnPGTeGGHg_GGODThxM7e3V-fp8Ag/formResponse"
      method="POST"
      target="_blank"
    >

      <label>Full Name</label>
      <input type="text" name="entry.1147428280" required>

      <label>Phone Number</label>
      <input type="tel" name="entry.1404403395" required>

      <label>Do you agree with the trip idea?</label>
      <div class="radio-group">
        <input type="radio" name="entry.1964980061" value="yes" required> Yes
        <input type="radio" name="entry.1964980061" value="no"> No
      </div>

      <label>Preferred Destination</label>
      <select name="entry.1116604285" required>
        <option value="">-- Select --</option>
        <option value="natural">Natural place</option>
        <option value="resort">Resort / Recreation</option>
        <option value="historical">Historical place</option>
      </select>

      <label>Preferred Activities</label>
      <textarea name="entry.513316649" placeholder="Games, music, discussion, photos..."></textarea>

      <label>Maximum Cost You Can Pay (ETB)</label>
      <input type="number" name="entry.1663040019">

      <label>Preferred Day</label>
      <select name="entry.195751698">
        <option>Saturday</option>
        <option>Sunday</option>
        <option>Weekday</option>
      </select>

      <button type="submit">Submit Response</button>
    </form>

    <div class="note">
      Responses will be collected to plan our class refresh trip.
    </div>
  </div>
</body>

</html>
